name: Daily Taiwan Stock Screener Auto-Update

on:
  schedule:
    # 每天早上 09:10 (台灣時間 UTC+8，對應 UTC 01:10) 自動抓取前一交易日完整結果
    - cron: '10 1 * * *'
    # 週一至週五下午 15:35 (台灣時間 UTC+8，對應 UTC 07:35) 盤後資料出爐自動更新
    - cron: '35 7 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-stock-data:
    runs-on: ubuntu-latest
    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 3. Run Full-Market Daily Screener & Tracker
        run: python3 update_stocks.py

      - name: 4. Commit and Push Updated Data
        run: |
          git config --local user.email "actions@github.com"
          git config --local user.name "GitHub Actions Stock Bot"
          git add -A
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update Taiwan stock screener $(date +'%Y-%m-%d %H:%M')" && git push)
